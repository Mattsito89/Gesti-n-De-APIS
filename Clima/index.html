<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Buscador de Clima</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 40px;
      background-color: #e8f5e9;
    }
    .caja {
      background-color: white;
      display: inline-block;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-shadow: 0px 2px 5px rgba(0,0,0,0.1);
    }
    input, button {
      padding: 8px;
      margin: 5px;
      font-size: 14px;
    }
    #resultado {
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="caja">
    <h2>Buscador de Clima</h2>
    <input type="text" id="ciudad" placeholder="Escribe una ciudad">
    <button onclick="buscarClima()">Buscar</button>

    <div id="resultado"></div>
  </div>

  <script src="clima.js"></script>
</body>
</html>
